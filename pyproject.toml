[project]
name = "homeassistant-ideenergy"
version = "2026.1.0"
dependencies = [
    "importlib-metadata; python_version >= '3.14'",
]
authors = [
  {name = "Luis López", email = "luis@cuarentaydos.com"},
]
readme = "README.md"
description ="Historical sensors for HomeAssistant"
license-files = [ "LICENSE" ]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.14.2"

[tool.black]
target-version = ['py314']

[tool.isort]
profile = "black"

[tool.mypy]
files = ["custom_components/ideenergy"]

[tool.pyupgrade]
addopts = "--py314-plus"

[dependency-groups]
dev = [
    "homeassistant>=2026.2.3",
    "ipdb>=0.13.13",
    "ipython>=9.12.0",
    "pre-commit>=4.5.1",
]
test = [
    "homeassistant-historical-sensor==3.0.0a4",
    "ideenergy @ https://github.com/ldotlopez/ideenergy/archive/f7b3118635a828e51dd41a52d238be87802e607f.zip",
    "pytest-homeassistant-custom-component>=0.13.375",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
